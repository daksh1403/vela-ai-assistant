[project]
name = "vela-api"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "starlette==1.3.1",
  "uvicorn==0.34.2",
  "httpx==0.28.1",
  "pydantic-settings==2.9.1",
  "prometheus-client==0.21.1",
]
[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0", "ruff==0.11.8", "mypy==1.15.0"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
