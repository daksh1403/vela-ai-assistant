services:
  api:
    environment:
      APP_ENV: production
  web:
    ports: !override ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./infra/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL required}
volumes:
  caddy_data:
  caddy_config:
