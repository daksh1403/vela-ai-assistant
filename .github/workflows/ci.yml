name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: python -m pip install -e '.[dev]'
        working-directory: api
      - run: ruff check . && ruff format --check . && mypy app && pytest -q --disable-warnings
        working-directory: api
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint && npm run typecheck && npm test && npm run build && npm audit --omit=dev --audit-level=high
        working-directory: web
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - run: npm ci
        working-directory: edge
      - run: npm run typecheck && npm test && npm run build && npm audit --omit=dev --audit-level=high
        working-directory: edge
      - run: npm ci && npm run build
        working-directory: web
      - run: npm run dry-run
        working-directory: edge
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet && docker compose -f compose.yaml -f compose.prod.yaml config --quiet
      - run: docker compose build && docker build -t vela-edge-ci -f edge/Dockerfile edge
      - run: docker compose up -d && sleep 8 && curl --fail --silent http://localhost:8080/api/v1/health/live && curl --fail --silent http://localhost:8080/
      - if: always()
        run: docker compose down --remove-orphans
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
