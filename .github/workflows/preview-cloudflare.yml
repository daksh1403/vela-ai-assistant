name: PR Preview
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
permissions:
  contents: read
  pull-requests: write
  deployments: write
concurrency:
  group: cloudflare-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Verify deployment credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo '::error::Configure CLOUDFLARE_API_TOKEN as a repository secret and CLOUDFLARE_ACCOUNT_ID as a repository variable. See docs/pr-previews.md.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            edge/package-lock.json
      - name: Build preview (CI checks run in the CI workflow)
        run: node scripts/build.mjs --ci --web-only
      - name: Upload isolated UI preview
        id: upload
        working-directory: edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          npx wrangler versions upload --config wrangler.preview.jsonc --preview-alias "pr-$PR_NUMBER" --message "$COMMIT_SHA" 2>&1 | tee preview-upload.log
          PREVIEW_URL="$(sed -nE 's/.*Version Preview Alias URL: *(https:\/\/[^[:space:]]+).*/\1/p' preview-upload.log | tail -1)"
          if [ -z "$PREVIEW_URL" ]; then
            echo '::error::Wrangler did not return a preview alias URL.'
            exit 1
          fi
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
      - name: Verify deployed preview
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "$PREVIEW_URL/api/v1/health/ready"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "$PREVIEW_URL/" | grep -q 'UI preview'
      - name: Publish review link
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        with:
          script: |
            const marker = '<!-- vela-pr-preview -->';
            const body = `${marker}\n### Vela preview\n\n[Open this PR’s preview](${process.env.PREVIEW_URL})\n\nCommit: \`${context.payload.pull_request.head.sha}\`\n\nChat and images use labelled demo responses. Live voice is available on production. This URL updates on each PR commit.\n\n[Deployment log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: context.issue.number });
            const previous = comments.find(comment => comment.user.type === 'Bot' && comment.body.includes(marker));
            if (previous) await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            const deployment = await github.rest.repos.createDeployment({ ...context.repo, ref: context.payload.pull_request.head.sha, environment: `preview-pr-${context.issue.number}`, auto_merge: false, required_contexts: [], production_environment: false, transient_environment: true });
            await github.rest.repos.createDeploymentStatus({ ...context.repo, deployment_id: deployment.data.id, state: 'success', environment_url: process.env.PREVIEW_URL, log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
  close:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const deployments = await github.paginate(github.rest.repos.listDeployments, { ...context.repo, environment: `preview-pr-${context.issue.number}` });
            for (const deployment of deployments) await github.rest.repos.createDeploymentStatus({ ...context.repo, deployment_id: deployment.id, state: 'inactive' });
